<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimulationWORLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a gate, a lobby of worlds, then one room per world. Inside a room the chat is a status sheet: portrait and parameters on top, log in the middle, input pinned below. */
:root{
  --bg:#eceff4;
  --surface:#fafbfd;
  --ink:#1f2433;
  --muted:#626a80;
  --line:#d3d8e3;
  --warm:#c53d5e;
  --cold:#3c5ca6;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141722;--surface:#1d212e;--ink:#e7e9f1;--muted:#9aa1b6;--line:#333a4d;--warm:#ee7390;--cold:#86a1e6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141722;--surface:#1d212e;--ink:#e7e9f1;--muted:#9aa1b6;--line:#333a4d;--warm:#ee7390;--cold:#86a1e6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 8px;flex-wrap:wrap}
.bar h1{font-family:var(--font-display);font-weight:800;font-size:20px;margin:0;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.nav{display:flex;gap:4px;flex:none;flex-wrap:wrap}
.nav a{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.view{flex:1;min-height:0;display:flex;flex-direction:column}
.page{overflow-y:auto;padding:0 16px 28px;display:block}

/* welcome */
#view-welcome{justify-content:center;padding:24px 20px 56px}
.gate-eyebrow{font-size:13px;letter-spacing:.3em;color:var(--muted);font-weight:700;margin:0 0 6px}
.gate-title{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,10vw,60px);line-height:1.08;margin:0;overflow-wrap:anywhere}
.gate-title span{color:var(--warm)}
.gate-rule{height:2px;background:var(--ink);width:72px;margin:18px 0}
.gate-lead{margin:0 0 26px;color:var(--muted);max-width:30em}
.gate-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn.big{height:52px;padding:0 30px;font-size:16px}

/* chat top row */
.stage{display:grid;grid-template-columns:minmax(104px,34%) 1fr;gap:10px;padding:0 16px 8px}
.portrait{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:4px;overflow:hidden;aspect-ratio:3/4;max-height:230px;width:100%}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px;text-align:center;padding:8px}
.placeholder svg{width:42%;height:auto;opacity:.5}
.params{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 11px;display:flex;flex-direction:column;gap:6px;min-width:0;max-height:230px;overflow-y:auto}
.params-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.focus-name{font-weight:700;font-size:13px;overflow-wrap:anywhere;min-width:0}
.label{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.aff-num{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;flex:none}
.aff-num.pos{color:var(--warm)} .aff-num.neg{color:var(--cold)}
.meter{position:relative;height:11px;background:var(--bg);border:1px solid var(--line);border-radius:2px}
.meter-fill{position:absolute;top:0;bottom:0;transition:left .4s,width .4s}
.meter-fill.pos{background:var(--warm)} .meter-fill.neg{background:var(--cold)}
.meter-zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.meter-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:1px;font-size:13px}
.stats dt{color:var(--muted)} .stats dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.delta-pos{color:var(--warm)} .delta-neg{color:var(--cold)}
.pbar{font-size:12px}
.pbar-top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.pbar-top span:last-child{font-variant-numeric:tabular-nums}
.pbar-track{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;background:var(--ink);transition:width .4s}
.present{display:flex;flex-direction:column;gap:5px}
.prow{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:2px 4px;cursor:pointer}
.prow[aria-pressed="true"]{border-color:var(--ink)}
.prow-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.prow-top span:last-child{font-variant-numeric:tabular-nums;flex:none}
.prow-top .pos{color:var(--warm)} .prow-top .neg{color:var(--cold)}
.prow-sub{font-size:11px;color:var(--muted);font-weight:400}
.pm{position:relative;height:6px;background:var(--bg);border:1px solid var(--line);border-radius:2px;margin-top:2px}
.pm i{position:absolute;top:0;bottom:0;display:block}
.pm i.pos{background:var(--warm)} .pm i.neg{background:var(--cold)}
.pm b{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink)}
.cast{display:flex;flex-wrap:wrap;gap:4px}
.cast button{font-size:11px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:1px 8px;cursor:pointer;font-variant-numeric:tabular-nums}
.cast button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}

.banner{margin:0 16px 6px;font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding:1px 0 1px 8px}
.banner.alert{border-left-color:var(--warm);color:var(--ink)}
.sysnote{margin:0 16px 6px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}

/* log */
#log{flex:1;min-height:80px;overflow-y:auto;margin:0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:13px;margin:auto;text-align:center;padding:0 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.msg{max-width:92%;display:flex;flex-direction:column;gap:2px}
.msg .who{font-size:11px;color:var(--muted);font-weight:700}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 11px;border-radius:3px}
.msg.char{align-self:flex-start}
.msg.char .body{background:var(--surface);border:1px solid var(--line)}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.user .body{background:var(--ink);color:var(--bg)}
.msg .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.mini{background:none;border:1px solid var(--line);border-radius:3px;font-size:12px;padding:1px 8px;cursor:pointer;color:var(--muted)}
.mini:hover{color:var(--ink);border-color:var(--ink)}
.mini.strong{color:var(--ink);border-color:var(--ink);font-weight:700}
.msg-edit{width:100%;min-width:230px;min-height:110px;padding:8px;border:1px solid var(--cold);border-radius:3px;background:var(--surface)}

#quick{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 0}
.qbtn{flex:none;max-width:78vw;text-align:left;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 9px;cursor:pointer}
.qbtn.choice{border-color:var(--cold)}
#composer{display:flex;gap:8px;padding:8px 16px 12px;align-items:flex-end}
#composer textarea{flex:1;min-width:0;resize:none;height:44px;max-height:120px;padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;border-radius:3px;padding:9px 16px;cursor:pointer;height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);height:auto;padding:6px 12px;font-size:13px}
.btn.big.ghost{height:52px;padding:0 22px;font-size:15px}

/* forms */
.note{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:40em}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select,.card input,.card textarea{padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:var(--surface);width:100%}
.field textarea,.card textarea{min-height:70px;resize:vertical}
.field textarea.tall{min-height:200px}
.field input[type=checkbox],.card input[type=checkbox],.field input[type=radio]{width:auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{font-family:var(--font-display);font-size:17px;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;margin-top:4px;padding-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.card .row{margin:0}
.card-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px}
.thumb{width:56px;height:74px;object-fit:cover;object-position:50% 15%;border:1px solid var(--line);border-radius:3px;background:var(--bg);flex:none}
.thumb.sm{width:38px;height:50px}
.imgrow{display:flex;gap:10px;align-items:center}
.imgrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:6px;align-items:center;font-size:13px}
.listrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;flex-wrap:wrap}
.listrow .who{display:flex;gap:10px;align-items:center;min-width:0}
.listrow strong{overflow-wrap:anywhere}
.badge{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted);white-space:nowrap}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.opt.off{opacity:.6}
@media (max-width:420px){.pair{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr 1fr}.aff-num{font-size:24px}}
@media (prefers-reduced-motion:reduce){.meter-fill,.pbar-fill{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="bar" hidden>
    <h1 id="barTitle">SimulationWORLD</h1>
    <nav class="nav" id="nav" aria-label="ページ"></nav>
  </header>

  <main class="view" id="view-welcome">
    <p class="gate-eyebrow">WELCOME TO</p>
    <h2 class="gate-title">Simulation<span>WORLD</span></h2>
    <div class="gate-rule"></div>
    <p class="gate-lead">ようこそ SimulationWORLD へ。世界観を書けば、その世界の住人たちが動き出します。世界ごとに部屋が分かれ、設定も会話も混ざりません。</p>
    <div class="gate-actions">
      <a class="btn big" href="#lobby">入室</a>
      <a class="btn big ghost" href="#api">API設定</a>
    </div>
    <p class="hint" id="keyState" style="margin-top:16px"></p>
  </main>

  <main class="view page" id="view-api" hidden></main>
  <main class="view page" id="view-lobby" hidden></main>
  <main class="view page" id="view-room" hidden></main>
  <main class="view page" id="view-cast" hidden></main>
  <main class="view page" id="view-memory" hidden></main>

  <main class="view" id="view-chat" hidden>
    <section class="stage">
      <div class="portrait">
        <img id="portrait" alt="" hidden>
        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 60 70" aria-hidden="true"><circle cx="30" cy="22" r="14" fill="currentColor"/><path d="M4 70c0-16 11-26 26-26s26 10 26 26z" fill="currentColor"/></svg>
          <span>世界や人物の画像は「世界」ページで追加できます</span>
        </div>
      </div>
      <div class="params">
        <span class="label">この場にいる人物</span>
        <div class="present" id="presentList"></div>
        <dl class="stats">
          <dt>場所</dt><dd id="stScene">—</dd>
          <dt>時間</dt><dd id="stTime">—</dd>
        </dl>
        <div id="customParams"></div>
      </div>
    </section>
    <p class="banner" id="banner" hidden></p>
    <p class="sysnote" id="sysNote" hidden></p>
    <section id="log" aria-live="polite"></section>
    <div id="quick"></div>
    <form id="composer">
      <label class="sr-only" for="input">メッセージ</label>
      <textarea id="input" placeholder="行動や発言を自由に書く…（場面への指示は（）で囲む）" rows="1"></textarea>
      <button class="btn" id="sendBtn" type="submit">送信</button>
    </form>
  </main>
</div>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
var $=function(id){return document.getElementById(id)};
var seq=0;
var DIRECT={value:1,checked:1,hidden:1,disabled:1,type:1,id:1,htmlFor:1,placeholder:1,src:1,alt:1,href:1,min:1,max:1,step:1,accept:1,multiple:1,name:1};
function h(tag,props,kids){var e=document.createElement(tag);
  if(props)for(var k in props){var v=props[k];if(v==null)continue;
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(DIRECT[k])e[k]=v;else e.setAttribute(k,v)}
  if(kids!=null)(Array.isArray(kids)?kids:[kids]).forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});
  return e}
function clone(o){return JSON.parse(JSON.stringify(o))}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function int(v){var n=parseInt(String(v==null?"":v).replace("−","-").replace("+",""),10);return isNaN(n)?0:n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function signed(n){return n>0?"+"+n:n<0?String(n):"±0"}
function byteLen(s){try{return new Blob([s]).size}catch(e){return s.length*3}}
function lsGet(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){try{setBanner("この端末の保存容量がいっぱいで、保存できませんでした。使わない世界を書き出してから削除してください。",true)}catch(x){}return false}}
function lsRaw(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsRawSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsRawSetOk(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function str(v){return String(v==null?"":v)}

/* ================= data model ================= */
var CH_FIELDS=[
  {k:"role",label:"立場・年齢",pair:1},
  {k:"first",label:"一人称",pair:1},
  {k:"callUser",label:"主人公の呼び方",pair:1},
  {k:"relation",label:"主人公との関係",pair:1},
  {k:"personality",label:"性格",area:1},
  {k:"speech",label:"口調・話し方",area:1,hint:"語尾や口ぐせの例があると再現度が上がります"},
  {k:"background",label:"経歴・背景",area:1},
  {k:"likes",label:"好きなもの・喜ぶこと",area:1},
  {k:"dislikes",label:"嫌いなもの・怒ること",area:1},
  {k:"other",label:"その他の設定",area:1}
];
var CH_KEYS=["role","first","callUser","relation","personality","speech","background","likes","dislikes","other","appearance","examples"];
var LEN_TXT={1:"平均300字程度",2:"平均600字程度",3:"平均1000字程度",4:"平均1500字程度",5:"2000字以上。複数の段落で、情景・人物の仕草・会話をじっくり描写する"};
function normLen(v){if(v==="s"||v==="m")return 1;if(v==="l")return 2;return clamp(int(v)||1,1,5)}
var DEFAULT_SYS=["あなたはAIアシスタントとしてではなく、このシミュレーション世界の書き手（語り手）として振る舞います。主人公（ユーザー）以外の登場人物すべてと、世界の出来事を担当します。",
  "・ユーザーの入力は、主人公の行動や台詞として受け取り、小説の文章として本文に織り込んでから、世界と登場人物の反応を書く。",
  "・ユーザーの入力に書かれていない主人公の重要な決断や台詞は作らない。次にどうするかは必ずユーザーに委ねる。",
  "・解説、注意書き、AIとしての発言など、物語の外の文章は本文に書かない。",
  "・世界観に本来いる人物や場所は、登録がなくても世界観に沿って自然に登場させる。",
  "・登場人物はそれぞれの事情と意思で動く。主人公に都合のよい展開ばかりにしない。"].join("\n");
var STYLE_DEF={narr:"novel",len:1,choices:true,pick:"ai",hist:12,chunk:10,autoCast:true};
function blankCharRec(){var s={};CH_KEYS.forEach(function(k){s[k]=""});return {id:uid(),name:"",auto:false,s:s,images:[],main:null,cur:null,affinity:0,mood:""}}
function blankWorld(){return {v:4,present:[],id:uid(),updatedAt:0,sample:false,name:"",lore:"",user:{name:"",profile:""},opening:"",greeting:"",note:"",
  style:clone(STYLE_DEF),image:null,chars:[],params:[],scene:"",time:"",turns:0,focus:null,lt:"",mem:[],book:[],
  shortcuts:[{id:uid(),label:"場面を進める",text:"場面を次へ進める"},{id:uid(),label:"時間を進める",text:"少し時間を進める"},{id:uid(),label:"情景を詳しく",text:"周囲の情景や人物の様子を詳しく描写する"}]}}
function sampleWorld(id){var w=blankWorld();if(id)w.id=id;w.sample=true;w.name="汐風町（サンプル）";
  w.lore="現代日本の小さな港町「汐風町」。坂道と路地が多く、夕方になると漁港から霧笛が聞こえる。商店街の外れに古書店「汐風堂」があり、町の人のたまり場になっている。派手な事件は起きないが、住人それぞれに小さな事情がある。";
  w.user.profile="最近この町に越してきた。古書店「汐風堂」に通い始めたところ。";
  w.opening="雨の午後、古書店「汐風堂」";w.scene=w.opening;w.time="午後";
  w.greeting="雨の午後、汐風堂の引き戸を開けると、古い紙の匂いがした。\n\n帳場で本を読んでいたミナトが顔を上げる。\n\nミナト「……あ、いらっしゃいませ。今日も来てくれたんですね」";
  var c=blankCharRec();c.name="ミナト";c.s.role="古書店「汐風堂」の店番。二十歳前後";c.s.first="わたし";c.s.callUser="あなた";c.s.relation="最近よく店に来るようになった客";
  c.s.personality="落ち着いていて人見知り。本の話になると急に饒舌になる";c.s.speech="丁寧語まじりの柔らかい話し方。「〜ですね」「〜かな」";
  c.s.background="祖父から継いだ古書店をひとりで切り盛りしている";c.s.likes="古い旅行記、雨の日、濃いめの紅茶";c.s.dislikes="本を乱暴に扱われること、大きな音";
  w.chars=[c];w.present=[c.id];
  w.book=[{id:uid(),keys:"祖父,おじいさん",text:"ミナトの祖父は三年前に亡くなった。店の奥の棚には祖父の蔵書がそのまま残っていて、売り物にはしていない。"}];

function allImages(w){var a=[];if(w.image)a.push(w.image);w.chars.forEach(function(c){c.images.forEach(function(r){a.push(r)})});return a}
function exportWorld(){if(!W)return;setRoomNote("書き出しを準備しています…");var w=clone(W),l=clone(L),imgs={};
  Promise.all(allImages(W).map(function(rec){return blobOf(rec).then(function(b){return b?blobToDataUrl(b):null}).then(function(u){if(u)imgs[rec.id]=u})}))

    var fname=(w.name.trim()||"world").replace(/[\\\/:*?"<>|\s]+/g,"_").slice(0,40)+".json";
    try{var bl=new Blob([data],{type:"application/json"}),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download=fname;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(u);a.remove()},5000);setRoomNote("書き出しました。iPhoneでは「ファイル」アプリの「ダウンロード」に保存されます。");return}catch(err){}

  box.appendChild(ta);box.appendChild(h("div",{class:"row",style:"margin-top:6px"},h("button",{class:"btn ghost",type:"button",text:"内容をコピー",onclick:function(){
    try{navigator.clipboard.writeText(ta.value).then(function(){setRoomNote("コピーしました。")}).catch(function(){ta.select();setRoomNote("自動でコピーできませんでした。選択した状態にしたので、手動でコピーしてください。")})}catch(e){ta.select()}}})))}
function importFile(file){if(busy)return;setIo("読み込んでいます…");
  var fr=new FileReader();fr.onerror=function(){setIo("ファイルを読めませんでした。")};
  fr.onload=function(){var j;try{j=JSON.parse(String(fr.result))}catch(e){j=null}
    if(!j||j.format!=="simulation-world"||!j.world){setIo("このファイルは読み込めません。この画面で書き出した世界のファイルを選んでください。");return}
    var w=normWorld(j.world);w.id=uid();w.sample=false;var imgs=j.images||{},jobs=[];
    function remap(rec){if(!rec)return null;var n={id:uid(),label:rec.label||"",assetId:null},src=imgs[rec.id];
      if(src)jobs.push(function(){return dataUrlToBlob(src).then(function(b){storeImage(n,{blob:b,dataUrl:src},w)}).catch(function(){})});return {old:rec.id,rec:n}}
    var wi=remap(w.image);w.image=wi?wi.rec:null;
    w.chars.forEach(function(c){var map={};c.images=c.images.map(function(r){var x=remap(r);map[x.old]=x.rec.id;return x.rec});c.main=map[c.main]||(c.images[0]?c.images[0].id:null);c.cur=null});
    var l=normLog(j.log,w.id);l.id=w.id;
    index.worlds.push({id:w.id,name:w.name.trim()||"名前のない世界",sample:false});saveIndex();
    w.updatedAt=Date.now();lsSet(K.w(w.id),w);dbPut("w_"+w.id,w);l.updatedAt=Date.now();lsSet(K.l(w.id),l);dbPut("l_"+w.id,l);
    var chain=Promise.resolve();jobs.forEach(function(job){chain=chain.then(job)});
    chain.then(function(){setIo("「"+(w.name||"名前のない世界")+"」を読み込みました。");renderLobby()})};
  fr.readAsText(file)}
